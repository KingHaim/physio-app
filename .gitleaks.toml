# Extends the default rule set. Custom rules cover two leak types that
# default rules missed on main: Postgres URLs with embedded passwords,
# and Netscape cookie-jar rows.
title = "physio-app gitleaks"

[extend]
useDefault = true

[[rules]]
id = "postgres-connection-url"
description = "Postgres or PostgreSQL URL that embeds a username and password"
regex = '''(?i)\b(?:postgres(?:ql)?)://[^\s/"':@]+:[^\s/"':@]+@[^\s/"']+'''
keywords = ["postgres://", "postgresql://"]

[[rules.allowlists]]
description = "Local test URLs and documented placeholders"
regexTarget = "match"
regexes = [
  '''(?i)(?:localhost|127\.0\.0\.1)(?::\d+)?''',
  '''(?i)your_[a-z0-9_]+''',
  '''(?i)user:pass@''',
]

[[rules]]
id = "netscape-cookie-jar"
description = "Netscape cookie-jar row (tab-separated domain, flag, path, secure, expiry, name, value)"
regex = '''(?:#HttpOnly_)?[^\s#\t]+\t(?:TRUE|FALSE)\t[^\t]+\t(?:TRUE|FALSE)\t\d+\t[^\t]+\t(\S+)'''
secretGroup = 1
keywords = ["true", "false"]
