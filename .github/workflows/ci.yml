# .github/workflows/ci.yml  — replaces python-tests.yml AND test.yml (delete both)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16        # match the Supabase project's major version
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_physio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_ENV: testing
      FLASK_APP: run.py
      # TestConfig only uses Postgres when TEST_DATABASE_URL is set (otherwise silently SQLite)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_physio
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_physio
      SECRET_KEY: ci-only-not-a-secret
      DISABLE_ENCRYPTION: "true"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System libs for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Generate throwaway Fernet key
        run: echo "FERNET_SECRET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Dependency sanity
        run: pip check

      - name: Alembic has a single head
        run: |
          heads=$(flask db heads | grep -c '(head)')
          echo "heads=$heads"; test "$heads" -eq 1

      # Enable once a baseline migration exists (fresh `flask db upgrade` currently fails: relation "user" does not exist)
      # - name: Migrate empty Postgres from scratch
      #   run: flask db upgrade && flask db check

      - name: Tests (Postgres)
        run: pytest tests/ -o addopts="" -v --tb=short --junitxml=test-results.xml --cov=app --cov-report=xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
