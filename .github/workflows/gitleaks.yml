name: gitleaks

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: Scan working tree for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan checked-out tree
        run: |
          # History still contains leaked credentials (audit C2). Do not scan
          # git history here — a full-history or PR-range scan would fail on
          # parent blobs and deletion diffs. This job only checks the
          # checked-out working tree so the PR can stay green while the owner
          # rotates keys and later decides whether to rewrite history.
          gitleaks detect --no-git --source . --verbose --redact
